name: hermes-tools
version: 0.1.0
description: Tools layer for Hermes. Call any Scalekit connector.
author: Scalekit
requires_env:
  - name: SCALEKIT_CLIENT_ID
    description: Scalekit client id from Dashboard, Developers, Settings, API Credentials
    url: https://app.scalekit.com
  - name: SCALEKIT_CLIENT_SECRET
    description: Scalekit client secret
    secret: true
    url: https://app.scalekit.com
  - name: SCALEKIT_ENVIRONMENT_URL
    description: Scalekit environment URL, for example https://your-env.scalekit.dev
    url: https://app.scalekit.com
  - name: SCALEKIT_IDENTIFIER
    description: Opaque id of the standing assistant, for example usr_8f3a2c
provides_tools: []
provides_hooks: []
